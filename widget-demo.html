<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Demo - Host Page</title>
    <script type="module" src="./dist-widget/employee-management-widget.js"></script>
    <style>
      :root {
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-primary-contrast: #ffffff;
        --color-background: #f1f5f9;
        --color-surface: #ffffff;
        --color-border: #e2e8f0;
        --color-text-primary: #0f172a;
        --color-text-secondary: #64748b;
        --color-danger: #dc2626;
        --color-danger-hover: #b91c1c;
        --color-success: #16a34a;
        --color-success-surface: #f0fdf4;
        --color-backdrop: rgb(0 0 0 / 0.45);
      }

      body {
        margin: 0;
        min-height: 100svh;
        background-color: var(--color-background, #f1f5f9);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .host-page-banner {
        padding: 12px 24px;
        background-color: #fef3c7;
        border-bottom: 1px solid #fde68a;
        color: #92400e;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <p class="host-page-banner">
      This is a plain HTML host page - the employee app below comes from ONE
      bundled JavaScript file (no Vite dev server, no npm).
    </p>
    <employee-app></employee-app>
  </body>
</html>
